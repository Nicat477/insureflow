<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/images/insureflow.svg" />
    <title>InsureFlow | Insurance Management Portal</title>
    <meta
      name="description"
      content="Independent insurance management portfolio demo with simulated property, CRM and finance integrations."
    />
    <meta name="theme-color" content="#f5f7fa" />
    <meta name="color-scheme" content="only light" />
    <style>html{background:#f5f7fa;color-scheme:only light}html.dark{background:#0b1018;color-scheme:dark}</style>
    <script>
      (function () {
        var match = document.cookie.match(/(?:^|;\s*)vite-ui-theme=([^;]+)/);
        var chosen = match ? match[1] : 'system';
        var dark = chosen === 'dark' || (chosen !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var mode = dark ? 'dark' : 'light';
        var scheme = dark ? 'dark' : 'only light';
        document.documentElement.classList.add(mode);
        document.documentElement.style.colorScheme = scheme;
        document.querySelector('meta[name="color-scheme"]').setAttribute('content', scheme);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0b1018' : '#f5f7fa');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
